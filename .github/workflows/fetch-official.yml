name: Fetch official briefings

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fetch-official.yml"
      - "server/fetch_official.py"
      - "server/scrapers.py"
  schedule:
    # 北京时间 08:00–21:30 每半小时一次；22:00–次日 08:00 不抓取。
    - cron: "*/30 0-13 * * *"

permissions:
  contents: write

concurrency:
  group: fetch-official-briefings
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install dependencies
        run: pip install -r server/requirements.txt
      - name: Fetch DLMU briefings
        run: python server/fetch_official.py
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add official-events.json
          if git diff --cached --quiet; then
            echo "No briefing changes"
            exit 0
          fi
          git commit -m "data: update official briefings"
          git push
