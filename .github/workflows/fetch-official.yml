name: Fetch official briefings

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: fetch-official-briefings
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r server/requirements.txt
      - name: Fetch DLMU briefings
        run: python server/fetch_official.py
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add official-events.json
          if git diff --cached --quiet; then
            echo "No briefing changes"
            exit 0
          fi
          git commit -m "data: update official briefings"
          git push
