name: Fetch official briefings (manual fallback)

on:
  workflow_dispatch:
    inputs:
      test_bark:
        description: "只发送一条 Bark 测试通知"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-official-manual
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Send Bark test notification
        if: inputs.test_bark == true
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
        run: python server/push_bark.py --test

      - name: Install dependencies
        if: inputs.test_bark != true
        run: pip install -r server/requirements.txt

      - name: Fetch DLMU briefings
        if: inputs.test_bark != true
        run: python server/fetch_official.py

      - name: Commit changed data
        if: inputs.test_bark != true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add official-events.json
          if git diff --cached --quiet; then
            echo "No briefing changes"
            exit 0
          fi
          git commit -m "data: update official briefings"
          git pull --rebase origin main
          git push origin HEAD:main
