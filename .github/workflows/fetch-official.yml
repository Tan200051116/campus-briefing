name: Fetch official briefings

on:
  workflow_dispatch:
    inputs:
      test_bark:
        description: "只发送一条 Bark 测试通知"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fetch-official.yml"
      - "server/fetch_official.py"
      - "server/push_bark.py"
      - "server/scrapers.py"
  schedule:
    # 北京时间 08:07–21:07 每小时检查一次，用于自续链意外中断后的恢复。
    - cron: "7 0-13 * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: fetch-official-briefings-${{ inputs.test_bark && github.run_id || 'chain' }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Check active hours
        id: mode
        shell: bash
        run: |
          hour=$(date +%H)
          if (( 10#$hour >= 8 && 10#$hour < 22 )); then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi
          test_bark=$(jq -r '(.inputs.test_bark // false) | tostring' "$GITHUB_EVENT_PATH")
          echo "test_bark=$test_bark" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.mode.outputs.active == 'true' || steps.mode.outputs.test_bark == 'true'

      - uses: actions/setup-python@v5
        if: steps.mode.outputs.active == 'true' || steps.mode.outputs.test_bark == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        if: steps.mode.outputs.active == 'true' && steps.mode.outputs.test_bark != 'true'
        run: pip install -r server/requirements.txt

      - name: Fetch DLMU briefings
        id: scrape
        if: steps.mode.outputs.active == 'true' && steps.mode.outputs.test_bark != 'true'
        env:
          NEW_EVENTS_FILE: ${{ runner.temp }}/new-official-events.json
        run: python server/fetch_official.py

      - name: Commit changed data
        id: commit
        if: steps.scrape.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add official-events.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No briefing changes"
            exit 0
          fi
          git commit -m "data: update official briefings"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: |
          curl --fail-with-body --retry 3 --retry-delay 2 \
            "https://purge.jsdelivr.net/gh/Tan200051116/campus-briefing@main/official-events.json"

      - name: Send Bark notification
        if: always() && (steps.mode.outputs.test_bark == 'true' || steps.commit.outputs.changed == 'true')
        continue-on-error: true
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
        shell: bash
        run: |
          if [[ "${{ steps.mode.outputs.test_bark }}" == "true" ]]; then
            python server/push_bark.py --test
          else
            python server/push_bark.py \
              --events-file "${{ runner.temp }}/new-official-events.json"
          fi

      - name: Queue next run in about five minutes
        if: always() && steps.mode.outputs.active == 'true' && steps.mode.outputs.test_bark != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED_AT: ${{ steps.mode.outputs.started_at }}
        shell: bash
        run: |
          now=$(date +%s)
          remaining=$((300 - (now - STARTED_AT)))
          if (( remaining > 0 )); then
            sleep "$remaining"
          fi
          hour=$(date +%H)
          if (( 10#$hour >= 8 && 10#$hour < 22 )); then
            gh workflow run fetch-official.yml --ref main
          else
            echo "Quiet hours started; the hourly watchdog will restart the chain tomorrow."
          fi
